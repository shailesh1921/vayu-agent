name: VAYU Daily Swing Analysis

on:
  schedule:
    # 9:15 AM IST = 3:45 UTC (IST = UTC+5:30)
    # Runs Mon-Fri at 3:45 UTC
    - cron: '45 3 * * 1-5'
  workflow_dispatch:  # Manual trigger

jobs:
  vayu-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pytz python-dotenv yfinance pandas numpy
      
      - name: Run VAYU Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python vayu_bot.py --once